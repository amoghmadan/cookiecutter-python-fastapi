services:
  application:
    build: .
    command: uvicorn {{cookiecutter.package_name}}.asgi:application --host 0.0.0.0 --port 8000 --workers 4 --log-level info
    container_name: "{{cookiecutter.package_name}}"
    environment:
      DEBUG: "True"
      SECRET_KEY: "a1b2c3d4e5f6g7h8i9j10k11l12m13n14o15p16q"
      DATABASE_DEFAULT: "sqlite+aiosqlite:////home/{{cookiecutter.package_name}}/{{cookiecutter.package_name}}/db.sqlite3"
    image: {{cookiecutter.package_name}}:${TAG:-local}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/home/{{cookiecutter.package_name}}/{{cookiecutter.package_name}}/logs
